name: Update Pattern Observations

# Run twice a week - Tuesdays and Fridays at 9 AM UTC
on:
  schedule:
    - cron: '0 9 * * 2' # Tuesday 9 AM UTC
    - cron: '0 9 * * 5' # Friday 9 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-observations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install node-fetch
      
      - name: Generate observations
        run: node scripts/generate-observations.js
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EtherWatch Bot"
          
          if git diff --quiet observations.json; then
            echo "No changes to observations"
          else
            git add observations.json
            git commit -m "🔄 Auto-update: Pattern observations from latest data"
            git push
          fi
